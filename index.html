<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>普通话 · Aussprache-Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=DM+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:          #F4F4F2;
  --bg2:         #FFFFFF;
  --bg3:         #EBEBEA;
  --border:      #D0D0CE;
  --text:        #111111;
  --text2:       #444444;
  --muted:       #888888;
  --red:         #E8001C;
  --red-dim:     rgba(232,0,28,0.08);
  --green:       #1A7A3C;
  --green-light: rgba(26,122,60,0.08);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; overflow: hidden;
  background: var(--bg); color: var(--text);
  font-family: 'DM Sans', -apple-system, 'Helvetica Neue', sans-serif;
  -webkit-font-smoothing: antialiased;
  touch-action: pan-y;
}

/* ── APP SHELL ── */
.app {
  display: flex; flex-direction: column;
  height: 100vh; height: 100dvh;
  max-width: 480px; margin: 0 auto;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
  position: relative;
}

/* ── HEADER ── */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px 12px;
  border-bottom: 2px solid var(--text);
  flex-shrink: 0; gap: 8px;
}
.header-brand {
  font-size: 15px; font-weight: 800; letter-spacing: -0.02em;
  color: var(--text); line-height: 1;
}
.header-brand small {
  display: block; font-size: 8px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--muted); margin-top: 2px;
}

/* ── SET SELECTOR ── */
.set-selector { position: relative; }
.set-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  border: 2px solid var(--text); background: transparent;
  color: var(--text); font-size: 12px; font-weight: 700;
  letter-spacing: 0.04em; text-transform: uppercase;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer; white-space: nowrap; max-width: 200px;
  transition: background 0.1s, color 0.1s;
}
.set-btn:hover { background: var(--text); color: var(--bg); }
.set-btn .dot { width: 6px; height: 6px; flex-shrink: 0; }
.set-btn .arrow { font-size: 10px; }
.set-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── DROPDOWN ── */
.set-group-header {
  padding: 10px 12px 4px; margin-top: 0;
  font-size: 8px; font-weight: 800; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.14em;
  border-top: 1px solid var(--border);
}
.set-group-header:first-child { border-top: none; }
.set-dropdown {
  position: absolute; top: calc(100% + 4px); right: 0;
  background: var(--bg2); border: 2px solid var(--text);
  min-width: 240px; max-height: 60vh; overflow-y: auto;
  z-index: 100; display: none; padding: 0;
}
.set-dropdown.open { display: block; }
.set-dropdown-item {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
  cursor: pointer; font-size: 12px; font-weight: 600;
  color: var(--text2); text-transform: uppercase;
  letter-spacing: 0.03em; transition: background 0.1s;
}
.set-dropdown-item:last-child { border-bottom: none; }
.set-dropdown-item:hover, .set-dropdown-item:active { background: var(--bg3); }
.set-dropdown-item.active { background: var(--text); color: var(--bg2); }
.set-dropdown-item .dot { width: 6px; height: 6px; flex-shrink: 0; }
.set-dropdown-item .count {
  margin-left: auto; font-size: 10px; font-family: 'DM Mono', monospace;
  font-weight: 500; color: var(--muted);
}
.set-dropdown-item.active .count { color: var(--border); }
.set-dropdown-overlay { position: fixed; inset: 0; z-index: 99; display: none; }
.set-dropdown-overlay.open { display: block; }

/* ── PROGRESS RING ── */
.progress-pill {
  display: flex; align-items: center; flex-shrink: 0;
}
.progress-pill .ring { width: 30px; height: 30px; position: relative; }
.progress-pill .ring svg { transform: rotate(-90deg); }
.progress-pill .ring-bg { stroke: var(--bg3); }
.progress-pill .ring-fill { stroke: var(--red); transition: stroke-dashoffset 0.4s; }
.progress-pill .ring-text {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 8px; font-weight: 800; color: var(--text);
  font-family: 'DM Mono', monospace;
}

/* ── CARD AREA ── */
.card-area {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  position: relative; overflow: hidden;
  padding: 12px 20px; min-height: 0;
}
.card-track {
  width: 100%; position: relative;
  display: flex; align-items: center; justify-content: center;
  flex: 1; min-height: 0;
}
.card {
  width: 100%; max-width: 360px;
  background: var(--bg2);
  border: 2px solid var(--text);
  padding: clamp(24px, 6vw, 44px) clamp(20px, 5vw, 36px);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  cursor: grab;
  transition: transform 0.3s cubic-bezier(0.22,1,0.36,1), opacity 0.3s ease;
  user-select: none; -webkit-user-select: none;
  position: relative; min-height: 180px;
}
.card:active { transform: scale(0.98); }
.card .tap-hint {
  position: absolute; top: 10px; right: 12px;
  font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted);
}
.card-char {
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(52px, 15vw, 86px);
  line-height: 1.1; text-align: center;
  color: var(--text); margin-bottom: 8px;
}
.card-pinyin {
  font-family: 'DM Mono', monospace;
  font-size: clamp(16px, 4.5vw, 21px);
  font-weight: 700; letter-spacing: 0.05em;
  color: var(--text); margin-bottom: 4px;
}
.card-meaning {
  font-size: clamp(12px, 3.2vw, 14px);
  font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.04em; color: var(--text2);
  text-align: center;
}

/* ── CARD NAV ── */
.card-nav {
  display: flex; align-items: center; justify-content: center;
  gap: 14px; padding: 8px 0 4px; flex-shrink: 0;
}
.nav-arrow {
  width: 36px; height: 36px;
  border: 2px solid var(--text); background: transparent;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; color: var(--text);
  cursor: pointer; transition: background 0.1s, color 0.1s;
}
.nav-arrow:hover { background: var(--text); color: var(--bg); }
.nav-arrow:active { transform: scale(0.92); }
.nav-arrow[disabled] { opacity: 0.2; pointer-events: none; }
.card-counter {
  font-family: 'DM Mono', monospace;
  font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
  color: var(--muted); min-width: 50px; text-align: center;
}

/* ── MIC ── */
.mic-area {
  display: flex; flex-direction: column; align-items: center;
  padding: 8px 20px 10px; flex-shrink: 0;
}
.mic-btn {
  width: 72px; height: 72px; border-radius: 50%;
  border: 3px solid var(--text); background: transparent;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: border-color 0.15s; position: relative;
}
.mic-btn .mic-icon {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--text);
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.mic-btn .mic-icon svg { fill: var(--bg2); width: 22px; height: 22px; }
.mic-btn:active { transform: scale(0.94); }
.mic-btn.listening { border-color: var(--red); animation: mic-pulse-ring 1.4s ease-in-out infinite; }
.mic-btn.listening .mic-icon { background: var(--red); }
@keyframes mic-pulse-ring {
  0%, 100% { box-shadow: 0 0 0 0 rgba(232,0,28,0.35); }
  50% { box-shadow: 0 0 0 14px rgba(232,0,28,0); }
}
.mic-label {
  font-size: 9px; font-weight: 700; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--muted);
  margin-top: 6px; text-align: center; min-height: 16px;
  transition: color 0.15s;
}
.mic-label.active { color: var(--red); }

/* ── STRICTNESS ── */
.strictness {
  display: flex; border: 2px solid var(--text);
  margin-top: 6px; overflow: hidden; flex-shrink: 0;
}
.strict-seg {
  padding: 5px 14px;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
  border: none; border-right: 1px solid var(--border);
  background: transparent; color: var(--muted);
  cursor: pointer; font-family: 'DM Sans', sans-serif;
  transition: background 0.1s, color 0.1s;
  white-space: nowrap;
}
.strict-seg:last-child { border-right: none; }
.strict-seg.active { background: var(--text); color: var(--bg2); }
.strict-seg .s-icon { display: none; }
.confidence-badge {
  display: inline-block; font-size: 9px; color: var(--muted);
  font-family: 'DM Mono', monospace; margin-left: 4px;
  font-weight: 500; letter-spacing: 0;
}

/* ── FEEDBACK ── */
.feedback-area {
  width: 100%; max-width: 360px; margin: 0 auto;
  padding: 0 20px; flex-shrink: 0;
  overflow-y: auto; max-height: 200px;
}
.feedback-area:empty { display: none; }
.feedback-card {
  background: var(--bg2); border: 2px solid var(--text);
  padding: 14px 16px; animation: fadeUp 0.2s ease-out;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.feedback-card.correct { border-color: var(--green); background: var(--green-light); }
.feedback-card.wrong { border-color: var(--red); background: var(--red-dim); }
.feedback-tag {
  display: inline-block; font-size: 9px; font-weight: 800;
  letter-spacing: 0.1em; text-transform: uppercase;
  padding: 2px 7px; margin-bottom: 6px;
  border: 1px solid currentColor; background: transparent;
}
.tag-correct { color: var(--green); }
.tag-close { color: var(--muted); }
.tag-retry { color: var(--red); }
.tag-ai { color: var(--text2); }
.feedback-text { font-size: 13px; color: var(--text2); line-height: 1.6; }
.feedback-heard {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
  color: var(--muted); margin-bottom: 8px;
  text-transform: uppercase;
}
.feedback-heard .heard-char {
  font-family: 'Noto Serif SC', serif;
  font-size: 16px; color: var(--text);
  text-transform: none;
}

/* Example sentence bonus */
.example-bonus {
  display: flex; align-items: center; gap: 10px;
  margin-top: 10px; padding: 10px 14px;
  border: 1px solid var(--border); background: var(--bg3);
  cursor: pointer; transition: background 0.1s;
}
.example-bonus:hover, .example-bonus:active { background: var(--bg); }
.example-bonus .icon {
  width: 24px; height: 24px; flex-shrink: 0;
  border: 2px solid var(--text);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800;
}
.example-bonus .label { font-size: 12px; color: var(--text2); }
.example-bonus .label strong {
  display: block; font-family: 'Noto Serif SC', serif;
  font-size: 14px; font-weight: 400; color: var(--text);
  margin-bottom: 1px;
}

/* AI loading */
.ai-loading::after {
  content: ''; display: inline-block;
  width: 5px; height: 5px;
  background: var(--text); margin-left: 4px;
  animation: blink 1s step-end infinite;
  vertical-align: middle;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* ── BOTTOM BAR ── */
.bottom-bar {
  display: flex; padding: 0 20px 8px;
  flex-shrink: 0; gap: 0;
}
.tts-pill {
  flex: 1; padding: 8px 0;
  border: 2px solid var(--text); border-right: none;
  background: transparent; color: var(--text);
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
  cursor: pointer; font-family: 'DM Sans', sans-serif;
  transition: background 0.1s, color 0.1s;
  text-align: center;
}
.tts-pill:last-child { border-right: 2px solid var(--text); }
.tts-pill:hover { background: var(--text); color: var(--bg); }
.tts-pill:active { transform: scale(0.97); }

/* ── EMPTY STATE ── */
.empty-state {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 10px; color: var(--muted); padding: 40px 20px;
}
.empty-state .icon {
  font-size: 10px; font-weight: 800; letter-spacing: 0.14em;
  text-transform: uppercase; border: 2px solid var(--border);
  padding: 8px 14px;
}
.empty-state p {
  font-size: 13px; text-align: center; line-height: 1.7;
  max-width: 240px;
}

/* ── TONE GUIDE ── */
.tone-toggle {
  display: flex; align-items: center; justify-content: center;
  gap: 6px; padding: 6px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted);
  cursor: pointer; flex-shrink: 0;
}
.tone-toggle:active { color: var(--text); }
.tone-bar { display: none; padding: 0 20px 10px; flex-shrink: 0; }
.tone-bar.open { display: block; }
.tones-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }
.tone-cell {
  background: var(--bg2); border: 1px solid var(--border);
  padding: 8px 4px; text-align: center;
}
.tone-cell .num { font-size: 8px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.tone-cell .sym { font-family: 'Noto Serif SC', serif; font-size: 20px; color: var(--text); }
.tone-cell .desc { font-size: 9px; font-weight: 600; color: var(--muted); line-height: 1.3; }

/* ── BROWSER WARNING ── */
.browser-warn {
  display: none; margin: 0 20px 0;
  padding: 10px 14px;
  background: var(--red-dim); border: 2px solid var(--red);
  font-size: 11px; font-weight: 600; color: var(--red);
  flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.04em;
}

/* ── SETTINGS ── */
.settings-btn {
  width: 28px; height: 28px;
  border: 2px solid var(--text); background: transparent;
  font-size: 16px; font-weight: 700; color: var(--text);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  margin-left: 6px; transition: background 0.1s, color 0.1s;
}
.settings-btn:hover { background: var(--text); color: var(--bg); }
.settings-panel {
  display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg); z-index: 200;
  flex-direction: column; padding: 0 20px;
}
.settings-panel.open { display: flex; }
.settings-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0 12px;
  border-bottom: 2px solid var(--text);
  font-size: 12px; font-weight: 800;
  letter-spacing: 0.1em; text-transform: uppercase;
}
.settings-close {
  width: 32px; height: 32px; border: 2px solid var(--text);
  background: transparent; font-size: 18px; font-weight: 700;
  color: var(--text); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.1s, color 0.1s;
}
.settings-close:hover { background: var(--text); color: var(--bg); }
.settings-body { padding: 20px 0; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; min-height: 0; }
.settings-stats {
  font-size: 12px; font-weight: 600; color: var(--text2);
  line-height: 1.8; padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
  overflow-y: auto; max-height: 50vh;
}
.settings-stats strong { font-weight: 800; color: var(--text); }
.settings-action {
  padding: 10px 16px; border: 2px solid var(--text);
  background: transparent; color: var(--text);
  font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  text-align: left; transition: background 0.1s, color 0.1s;
}
.settings-action:hover { background: var(--text); color: var(--bg); }
.settings-action.danger { border-color: var(--red); color: var(--red); }
.settings-action.danger:hover { background: var(--red); color: var(--bg2); }
.settings-msg {
  font-size: 11px; font-weight: 600; color: var(--green);
  letter-spacing: 0.04em; min-height: 18px;
  text-transform: uppercase;
}
.settings-msg.error { color: var(--red); }

/* ── SWIPE ── */
.card.swipe-left { transform: translateX(-110%) rotate(-3deg); opacity: 0; }
.card.swipe-right { transform: translateX(110%) rotate(3deg); opacity: 0; }
.card.swipe-enter-left { animation: enterFromRight 0.25s ease-out forwards; }
.card.swipe-enter-right { animation: enterFromLeft 0.25s ease-out forwards; }
@keyframes enterFromRight {
  from { transform: translateX(50px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
@keyframes enterFromLeft {
  from { transform: translateX(-50px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* ── FLASH ── */
.card.flash-correct { animation: flashCorrect 0.35s ease-out; }
@keyframes flashCorrect {
  0% { box-shadow: none; }
  50% { box-shadow: 4px 4px 0 var(--green); border-color: var(--green); }
  100% { box-shadow: none; }
}
.card.flash-wrong { animation: flashWrong 0.35s ease-out; }
@keyframes flashWrong {
  0% { box-shadow: none; }
  50% { box-shadow: 4px 4px 0 var(--red); border-color: var(--red); }
  100% { box-shadow: none; }
}

/* ── RESPONSIVE: small screens ── */
@media (max-height: 700px) {
  .header { padding: 8px 16px 6px; }
  .header-brand { font-size: 13px; }
  .card { padding: clamp(16px, 4vw, 28px) clamp(16px, 4vw, 28px); min-height: 150px; }
  .card-char { font-size: clamp(44px, 12vw, 64px); margin-bottom: 4px; }
  .card-pinyin { font-size: 14px; margin-bottom: 2px; }
  .card-meaning { font-size: 11px; }
  .card-nav { padding: 4px 0 2px; gap: 10px; }
  .nav-arrow { width: 30px; height: 30px; font-size: 14px; }
  .mic-area { padding: 4px 20px 6px; }
  .mic-btn { width: 58px; height: 58px; }
  .mic-btn .mic-icon { width: 36px; height: 36px; }
  .mic-btn .mic-icon svg { width: 18px; height: 18px; }
  .mic-label { margin-top: 3px; font-size: 8px; min-height: 12px; }
  .strictness { margin-top: 3px; }
  .strict-seg { padding: 3px 10px; font-size: 9px; }
  .bottom-bar { padding: 0 16px 4px; }
  .tts-pill { padding: 5px 0; font-size: 10px; }
  .tone-toggle { padding: 3px; font-size: 9px; }
  .feedback-area { max-height: 130px; }
  .feedback-card { padding: 10px 12px; }
  .feedback-tag { font-size: 8px; }
  .feedback-text { font-size: 12px; line-height: 1.5; }
}

@media (min-height: 750px) {
  .card { padding: clamp(32px, 7vw, 52px) clamp(24px, 6vw, 40px); }
  .card-char { font-size: clamp(60px, 16vw, 88px); }
  .mic-area { padding: 10px 20px 14px; }
  .mic-btn { width: 80px; height: 80px; }
  .mic-btn .mic-icon { width: 50px; height: 50px; }
  .mic-btn .mic-icon svg { width: 24px; height: 24px; }
  .feedback-area { max-height: 240px; }
}

@media (min-height: 900px) {
  .feedback-area { max-height: 300px; }
  .card-area { padding: 20px 20px; }
}
</style>
</head>
<body>

<div class="app" id="app">
  <!-- HEADER -->
  <div class="header">
    <div class="header-brand">普通话<small>Aussprache-Trainer</small></div>
    <div class="set-selector">
      <button class="set-btn" id="setBtn" onclick="toggleDropdown()">
        <span class="dot" id="setDot"></span>
        <span id="setLabel">Block 1</span>
        <span class="arrow">▾</span>
      </button>
      <div class="set-dropdown-overlay" id="dropOverlay" onclick="toggleDropdown()"></div>
      <div class="set-dropdown" id="setDropdown"></div>
    </div>
    <div class="progress-pill">
      <div class="ring">
        <svg width="28" height="28" viewBox="0 0 28 28">
          <circle class="ring-bg" cx="14" cy="14" r="11" fill="none" stroke-width="2.5"/>
          <circle class="ring-fill" id="progressRing" cx="14" cy="14" r="11" fill="none" stroke-width="2.5"
            stroke-dasharray="69.12" stroke-dashoffset="69.12" stroke-linecap="square"/>
        </svg>
        <div class="ring-text" id="progressText">0</div>
      </div>
      <button class="settings-btn" id="settingsBtn" onclick="toggleSettings()">≡</button>
    </div>
  </div>

  <!-- SETTINGS PANEL -->
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-header">
      <span>Fortschritt</span>
      <button class="settings-close" onclick="toggleSettings()">×</button>
    </div>
    <div class="settings-body">
      <div class="settings-stats" id="settingsStats"></div>
      <button class="settings-action" onclick="exportProgress()">Speichern (Kopieren)</button>
      <button class="settings-action" onclick="importProgress()">Laden (Einfügen)</button>

// ── STORAGE ──
const RK = 'putonghua_results_v4';
function loadResults() { try { return JSON.parse(localStorage.getItem(RK) || '{}'); } catch(e) { return {}; } }
function saveResults(r) { localStorage.setItem(RK, JSON.stringify(r)); }

// ── STATE ──
// Blocks always come from SEED (code is the source of truth)
let allBlocks = SEED;
let results = loadResults();
let currentBlockIdx = 0;
let currentCardIdx = 0;
let currentWord = null;
let recognition = null;
let isListening = false;
let autoAdvanceTimer = null;
let strictness = parseInt(localStorage.getItem('putonghua_strictness') || '0');

// Strictness: 0=locker, 1=normal, 2=streng
const STRICT_CONF = [0, 0.6, 0.85]; // min confidence thresholds

function setStrictness(level) {
  strictness = level;
  localStorage.setItem('putonghua_strictness', level);
  document.querySelectorAll('.strict-seg').forEach(s => {
    s.classList.toggle('active', parseInt(s.dataset.level) === level);
  });
}

function initStrictness() {
  document.querySelectorAll('.strict-seg').forEach(s => {
    s.classList.toggle('active', parseInt(s.dataset.level) === strictness);
  });
}

// ── INIT ──
function init() {
  initTTS();
  initSpeech();
  initStrictness();
  renderDropdown();
  loadBlock(0);
}

// ── DROPDOWN ──
function toggleDropdown() {
  const dd = document.getElementById('setDropdown');
  const ov = document.getElementById('dropOverlay');
  const open = dd.classList.toggle('open');
  ov.classList.toggle('open', open);
}

function renderDropdown() {
  const dd = document.getElementById('setDropdown');
  dd.innerHTML = '';
  let lastGroup = '';
  allBlocks.forEach((bl, i) => {
    // Group header
    if (bl.group && bl.group !== lastGroup) {
      lastGroup = bl.group;
      const hdr = document.createElement('div');
      hdr.className = 'set-group-header';
      hdr.textContent = bl.group;
      dd.appendChild(hdr);
    }
    const done = Object.keys(results[bl.block] || {}).length;
    const total = bl.words.length;
    const item = document.createElement('div');
    item.className = 'set-dropdown-item' + (i === currentBlockIdx ? ' active' : '');
    item.innerHTML = `<span class="dot" style="background:${bl.color}"></span>
      <span>${bl.title}</span>
      <span class="count">${done}/${total}</span>`;
    item.addEventListener('click', () => { toggleDropdown(); loadBlock(i); });
    dd.appendChild(item);
  });
}

function updateSetBtn() {
  const bl = allBlocks[currentBlockIdx];
  document.getElementById('setDot').style.background = bl.color;
  document.getElementById('setLabel').textContent = bl.title;
}

// ── LOAD BLOCK ──
function loadBlock(idx) {
  currentBlockIdx = idx;
  currentCardIdx = 0;
  const bl = allBlocks[idx];
  if (!bl) return;
  updateSetBtn();
  renderDropdown();
  showCard(0);
  updateProgress();
  clearFeedback();
}

// ── SHOW CARD ──
function showCard(idx, direction) {
  const bl = allBlocks[currentBlockIdx];
  if (!bl || !bl.words[idx]) return;
  
  currentCardIdx = idx;
  currentWord = bl.words[idx];
  
  const card = document.getElementById('card');
  const w = currentWord;
  
  // Check if already practiced
  const br = results[bl.block] || {};
  const status = br[idx];
  
  // Animate direction
  if (direction === 'left') {
    card.className = 'card swipe-left';
    requestAnimationFrame(() => {
      setTimeout(() => {
        renderCard(w, status);
        card.className = 'card swipe-enter-left';
      }, 150);
    });
  } else if (direction === 'right') {
    card.className = 'card swipe-right';
    requestAnimationFrame(() => {
      setTimeout(() => {
        renderCard(w, status);
        card.className = 'card swipe-enter-right';
      }, 150);
    });
  } else {
    renderCard(w, status);
    card.className = 'card';
  }
  
  // Update counter & nav
  document.getElementById('cardCounter').textContent = `${idx + 1} / ${bl.words.length}`;
  document.getElementById('navPrev').disabled = idx <= 0;
  document.getElementById('navNext').disabled = idx >= bl.words.length - 1;
  
  // Restart mic if already listening when card switches
  const wasListening = isListening;
  if (isListening) {
    try { recognition.abort(); } catch(e) {}
    isListening = false;
  }
  clearFeedback();
  if (wasListening) {
    setTimeout(() => startMic(), 300);
  }
}

function renderCard(w, status) {
  const card = document.getElementById('card');
  const bl = allBlocks[currentBlockIdx];
  const BLOCK_TINTS = {1:'#FAFAFA',2:'#F2F5F2',3:'#FDFAF2',4:'#F2F4F8'};
  const tint = BLOCK_TINTS[bl.block] || '#FFFFFF';
  let border = '';
  if (status === 'correct') border = 'border-color: var(--green);';
  if (status === 'wrong') border = 'border-color: var(--red);';
  
  card.style.cssText = `background:${tint};${border}`;
  card.innerHTML = `
    <span class="tap-hint">Anhören</span>
    <div class="card-char">${w.char}</div>
    <div class="card-pinyin">${w.pinyin}</div>
    <div class="card-meaning">${w.de}</div>`;
}

// ── NAVIGATION ──
function nextCard() {
  const bl = allBlocks[currentBlockIdx];
  if (currentCardIdx < bl.words.length - 1) {
    showCard(currentCardIdx + 1, 'left');
  }
}
function prevCard() {
  if (currentCardIdx > 0) {
    showCard(currentCardIdx - 1, 'right');
  }
}

// ── SWIPE (touch + mouse for desktop testing) ──
let touchStartX = 0, touchStartY = 0, touchDeltaX = 0, swiping = false;
const cardArea = document.getElementById('cardArea');

// Touch
cardArea.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchDeltaX = 0; swiping = true;
}, { passive: true });

cardArea.addEventListener('touchmove', e => {
  if (!swiping) return;
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
    touchDeltaX = dx;
    const card = document.getElementById('card');
    card.style.transform = `translateX(${dx * 0.4}px) rotate(${dx * 0.02}deg)`;
    card.style.transition = 'none';
  }
}, { passive: true });

cardArea.addEventListener('touchend', () => {
  if (!swiping) return;
  swiping = false;
  const card = document.getElementById('card');
  card.style.transition = '';
  card.style.transform = '';
  if (touchDeltaX < -60) nextCard();
  else if (touchDeltaX > 60) prevCard();
});

// Mouse (desktop testing)
cardArea.addEventListener('mousedown', e => {
  if (e.target.closest('.nav-arrow')) return; // don't hijack buttons
  touchStartX = e.clientX;
  touchDeltaX = 0; swiping = true;
  e.preventDefault();
});

document.addEventListener('mousemove', e => {
  if (!swiping) return;
  const dx = e.clientX - touchStartX;
  touchDeltaX = dx;
  const card = document.getElementById('card');
  card.style.transform = `translateX(${dx * 0.4}px) rotate(${dx * 0.02}deg)`;
  card.style.transition = 'none';
});

document.addEventListener('mouseup', () => {
  if (!swiping) return;
  swiping = false;
  const card = document.getElementById('card');
  card.style.transition = '';
  card.style.transform = '';
  if (touchDeltaX < -60) nextCard();
  else if (touchDeltaX > 60) prevCard();
});

// Click = speak (only if not a drag)
cardArea.addEventListener('click', e => {
  if (Math.abs(touchDeltaX) > 15) return; // was a drag, not a tap
  if (e.target.closest('.nav-arrow')) return;
  speakCurrent();
});

// ── TTS ──
let ttsVoice = null;
function initTTS() {
  const load = () => {
    const v = speechSynthesis.getVoices();
    ttsVoice = v.find(x => x.lang === 'zh-CN') || v.find(x => x.lang === 'zh-TW') || v.find(x => x.lang.startsWith('zh')) || null;
  };
  load();
  speechSynthesis.onvoiceschanged = load;
}
function speak(text, rate = 0.85) {
  if (!text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN'; u.rate = rate; u.pitch = 1;
  if (ttsVoice) u.voice = ttsVoice;
  speechSynthesis.speak(u);
}
function speakCurrent() { if (currentWord) speak(currentWord.char); }
function speakSlow() { if (currentWord) speak(currentWord.char, 0.45); }
function speakExample() { if (currentWord) speak(currentWord.ex_cn, 0.75); }

// ── SPEECH RECOGNITION ──
let micTimeout = null;
const MIC_TIMEOUT_MS = 15000; // auto-stop after 15s idle (resets on each card/result)

function initSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { document.getElementById('warn').style.display = 'block'; return false; }
  recognition = new SR();
  recognition.lang = 'zh-CN';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 3;
  recognition.onresult = e => {
    clearMicTimeout();
    const alts = Array.from(e.results[0]).map(r => ({
      text: r.transcript.trim(),
      conf: r.confidence
    }));
    handleResult(alts);
  };
  recognition.onerror = e => {
    clearMicTimeout();
    // 'aborted' is expected when we force-stop — don't show error
    if (e.error === 'aborted') { resetMic(); return; }
    isListening = false;
    resetMic();
    showFeedback('error', `Mikrofon-Fehler: ${e.error}`);
  };
  recognition.onend = () => {
    clearMicTimeout();
    if (isListening) {
      // iOS: auto-restart after each result to keep mic alive
      try {
        recognition.start();
        micTimeout = setTimeout(() => {
          if (isListening) stopMic();
        }, MIC_TIMEOUT_MS);
      } catch(e) {
        isListening = false;
        resetMic();
      }
    } else {
      resetMic();
    }
  };
  return true;
}

function startMic() {
  if (!recognition && !initSpeech()) return;
  if (!currentWord) return;
  
  isListening = true;
  const btn = document.getElementById('micBtn');
  const lbl = document.getElementById('micLabel');
  btn.classList.add('listening');
  lbl.textContent = 'Ich höre zu …';
  lbl.classList.add('active');
  
  try { 
    recognition.start();
    micTimeout = setTimeout(() => {
      if (isListening) stopMic();
    }, MIC_TIMEOUT_MS);
  } catch(e) {
    isListening = false;
    resetMic();
  }
}

function toggleMic() {
  if (isListening) {
    stopMic();
    return;
  }
  startMic();
}

function stopMic() {
  clearMicTimeout();
  isListening = false; // set BEFORE abort so onend doesn't restart
  if (recognition) {
    try { recognition.abort(); } catch(e) {}
  }
  resetMic();
}

function clearMicTimeout() {
  if (micTimeout) { clearTimeout(micTimeout); micTimeout = null; }
}

// ── STOP MIC ON TAB SWITCH / BLUR ──
document.addEventListener('visibilitychange', () => {
  if (document.hidden && isListening) stopMic();
});
window.addEventListener('blur', () => {
  if (isListening) stopMic();
});
window.addEventListener('pagehide', () => {
  if (isListening) stopMic();
});

function resetMic() {
  const btn = document.getElementById('micBtn');
  const lbl = document.getElementById('micLabel');
  if (!btn) return;
  btn.classList.remove('listening');
  lbl.textContent = currentWord ? 'Tippe & sprich' : '';
  lbl.classList.remove('active');
}

// ── HANDLE RESULT ──
function handleResult(alts) {
  const w = currentWord;
  if (!w) return;
  
  const heard = alts[0]?.text || '';
  const topConf = alts[0]?.conf || 0;
  const clean = s => s.replace(/[，。！？、\s]/g, '');
  const minConf = STRICT_CONF[strictness];
  
  let match = false;
  if (strictness === 0) {
    // Locker: any alternative matches
    match = alts.some(a => clean(a.text) === clean(w.char));
  } else if (strictness === 1) {
    // Normal: first alternative must match + confidence > 0.6
    match = clean(heard) === clean(w.char) && topConf >= minConf;
  } else {
    // Streng: first alternative only + confidence > 0.85
    match = clean(heard) === clean(w.char) && topConf >= minConf;
  }
  
  const bl = allBlocks[currentBlockIdx];
  const card = document.getElementById('card');
  const confPct = Math.round(topConf * 100);
  
  // Save result
  if (!results[bl.block]) results[bl.block] = {};
  results[bl.block][currentCardIdx] = match ? 'correct' : 'wrong';
  saveResults(results);
  updateProgress();
  
  // Flash card
  card.classList.add(match ? 'flash-correct' : 'flash-wrong');
  setTimeout(() => card.classList.remove('flash-correct', 'flash-wrong'), 500);
  
  if (match) {
    showCorrectFeedback(heard, w, confPct);
    autoAdvanceTimer = setTimeout(() => {
      if (currentCardIdx < bl.words.length - 1) nextCard();
    }, 2200);
  } else {
    const altTexts = alts.map(a => a.text);
    showWrongFeedback(heard, altTexts, w, confPct);
  }
}

function showCorrectFeedback(heard, w, confPct) {
  const fa = document.getElementById('feedbackArea');
  const confLabel = confPct > 0 ? `<span class="confidence-badge">${confPct}%</span>` : '';
  fa.innerHTML = `
    <div class="feedback-card correct">
      <span class="feedback-tag tag-correct">✓ Richtig! ${confLabel}</span>
      <div class="feedback-text">${w.tip}</div>
      <div class="example-bonus" onclick="playExampleBonus(event)">
        <span class="icon">▶</span>
        <div class="label">
          <strong>${w.ex_cn}</strong>
          ${w.ex_de}
        </div>
      </div>
    </div>`;
}

function showWrongFeedback(heard, alternatives, w, confPct) {
  const fa = document.getElementById('feedbackArea');
  const confLabel = confPct > 0 ? `<span class="confidence-badge">${confPct}%</span>` : '';
  fa.innerHTML = `
    <div class="feedback-card wrong">
      <div class="feedback-heard">
        Gehört: <span class="heard-char">${heard || '(nichts)'}</span> ${confLabel}
      </div>
      <span class="feedback-tag tag-retry">Nochmal</span>
      <div class="feedback-text">${w.tip}</div>
    </div>`;
  getAiFeedback(heard, alternatives, w);
}

function playExampleBonus(e) {
  e.stopPropagation();
  // Cancel auto-advance since user is engaging
  if (autoAdvanceTimer) clearTimeout(autoAdvanceTimer);
  if (currentWord) speak(currentWord.ex_cn, 0.75);
}

function showFeedback(type, msg) {
  const fa = document.getElementById('feedbackArea');
  fa.innerHTML = `<div class="feedback-card"><span class="feedback-tag tag-retry">${type}</span><div class="feedback-text">${msg}</div></div>`;
}

function clearFeedback() {
  if (autoAdvanceTimer) clearTimeout(autoAdvanceTimer);
  document.getElementById('feedbackArea').innerHTML = '';
}

// ── AI FEEDBACK ──
async function getAiFeedback(heard, alternatives, w) {
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514', max_tokens: 300,
        messages: [{ role: 'user', content:
          `Du bist ein freundlicher Mandarin-Coach für deutschsprachige Anfänger. Kurz und ermutigend!\n\nZielwort: ${w.char} (${w.pinyin}) — "${w.de}"\nErkannt: "${heard}"\nAlternativen: ${alternatives.join(', ')}\n\nGib 2 kurze Sätze: 1) Was war falsch? 2) Konkreter Tipp.`
        }]
      })
    });
    const data = await res.json();
    const text = data.content?.[0]?.text || '';
    if (text) {
      const fa = document.getElementById('feedbackArea');
      const existing = fa.querySelector('.feedback-text');
      if (existing) existing.innerHTML = text;
    }
  } catch(e) { /* Offline — tip already shown */ }
}

// ── PROGRESS ──
function updateProgress() {
  const bl = allBlocks[currentBlockIdx];
  const total = bl.words.length;
  const done = Object.keys(results[bl.block] || {}).length;
  const pct = total > 0 ? done / total : 0;
  
  // Ring
  const circ = 2 * Math.PI * 11; // ~69.12
  const offset = circ * (1 - pct);
  document.getElementById('progressRing').style.strokeDashoffset = offset;
  document.getElementById('progressText').textContent = done;
  
  // Update dropdown counts
  renderDropdown();
}

// ── SETTINGS / EXPORT / IMPORT ──
function toggleSettings() {
  const panel = document.getElementById('settingsPanel');
  const open = panel.classList.toggle('open');
  if (open) renderStats();
}

function renderStats() {
  let lastGroup = '';
  let html = '';
  let totalDone = 0, totalWords = 0;
  allBlocks.forEach(bl => {
    if (bl.group !== lastGroup) {
      lastGroup = bl.group;
      html += `<div style="font-size:8px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-top:10px;margin-bottom:2px;">${bl.group}</div>`;
    }
    const br = results[bl.block] || {};
    const done = Object.keys(br).length;
    const correct = Object.values(br).filter(v => v === 'correct').length;
    const total = bl.words.length;
    totalDone += done; totalWords += total;
    const pct = total > 0 ? Math.round(done / total * 100) : 0;
    const bar = `<div style="flex:1;height:4px;background:var(--bg3);"><div style="height:4px;background:${pct===100?'var(--green)':'var(--text)'};width:${pct}%;"></div></div>`;
    html += `<div style="display:flex;align-items:center;gap:8px;padding:3px 0;font-size:11px;">
      <span style="flex:1;font-weight:600;color:var(--text2);">${bl.title}</span>
      ${bar}
      <span style="font-family:'DM Mono';font-size:10px;color:var(--muted);min-width:36px;text-align:right;">${done}/${total}</span>
    </div>`;
  });
  html = `<div style="font-weight:800;font-size:12px;margin-bottom:6px;"><strong>${totalDone}</strong> / ${totalWords} geübt</div>` + html;
  document.getElementById('settingsStats').innerHTML = html;
}

function exportProgress() {
  const data = JSON.stringify({ results, strictness, exported: new Date().toISOString() });
  navigator.clipboard.writeText(data).then(() => {
    showSettingsMsg('In Zwischenablage kopiert!');
  }).catch(() => {
    // Fallback: prompt
    prompt('Kopiere diesen Text:', data);
    showSettingsMsg('Manuell kopieren.');
  });
}

function importProgress() {
  const raw = prompt('Füge deinen exportierten Fortschritt ein:');
  if (!raw) return;
  try {
    const data = JSON.parse(raw);
    if (data.results) {
      results = data.results;
      saveResults(results);
      if (data.strictness !== undefined) {
        strictness = data.strictness;
        localStorage.setItem('putonghua_strictness', strictness);
        initStrictness();
      }
      updateProgress();
      renderStats();
      showSettingsMsg('Fortschritt importiert!');
    } else {
      showSettingsMsg('Ungültiges Format.', true);
    }
  } catch(e) {
    showSettingsMsg('Ungültiges JSON.', true);
  }
}

function resetProgress() {
  if (!confirm('Gesamten Fortschritt löschen? Das kann nicht rückgängig gemacht werden.')) return;
  results = {};
  saveResults(results);
  updateProgress();
  renderStats();
  showSettingsMsg('Fortschritt gelöscht.');
}

function showSettingsMsg(text, isError) {
  const el = document.getElementById('settingsMsg');
  el.textContent = text;
  el.className = 'settings-msg' + (isError ? ' error' : '');
  setTimeout(() => { el.textContent = ''; }, 3000);
}

// ── TONE GUIDE ──
function toggleTones() {
  const bar = document.getElementById('toneBar');
  const arrow = document.getElementById('toneArrow');
  const open = bar.classList.toggle('open');
  arrow.textContent = open ? '▴' : '▾';
}

// ── KEYBOARD NAV ──
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prevCard();
  else if (e.key === 'ArrowRight') nextCard();
  else if (e.key === ' ') { e.preventDefault(); toggleMic(); }
  else if (e.key === 'Enter') speakCurrent();
});

// ── BOOT ──
init();
</script>
</body>
</html>
